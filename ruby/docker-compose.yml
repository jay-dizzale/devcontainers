services:
  ruby:
    build:
      context: ..
      dockerfile: ruby/Dockerfile
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
      secrets:
        - github_token
    ports:
      - "127.0.0.1:3010-3019:3000" # Rails/Puma default dev server
    extends:
      file: ../common/base.docker-compose.yml
      service: base

secrets:
  github_token:
    environment: "GITHUB_TOKEN"
