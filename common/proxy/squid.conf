# Whitelist-enforcing forward proxy for devcontainer runtime traffic.
# Every dev container's HTTP_PROXY/HTTPS_PROXY points here; the `dev` service
# sits on a Docker network with no other route to the internet, so this is
# the only path out. See ../../AGENTS.md for how to add a domain.

http_port 3128

acl SSL_ports port 443
acl Safe_ports port 80 443
acl CONNECT method CONNECT

# Ollama running on the Docker host (openwebui-toolbelt, or any env talking
# to it). Port 11434 and host.docker.internal are tied to each other in both
# directions: 11434 is let through for plain HTTP to host.docker.internal
# only, and host.docker.internal is reachable on 11434 only — never on any
# other host port, never as a CONNECT tunnel. host.docker.internal still has
# to be on the whitelist like any other domain
# (whitelist.d/openwebui-toolbelt.txt).
acl Ollama_port port 11434
acl docker_host dstdomain host.docker.internal

# Domain whitelist — generated at container start from whitelist.d/*.txt
# by entrypoint.sh. Matches on the CONNECT target for HTTPS (i.e. SNI/host,
# not the decrypted URL) and on the request host for plain HTTP.
acl whitelist dstdomain "/etc/squid/whitelist.txt"

# Reject anything outside plain HTTP/HTTPS before considering the whitelist.
http_access deny !Safe_ports !Ollama_port
http_access deny Ollama_port !docker_host
http_access deny docker_host !Ollama_port
http_access deny CONNECT !SSL_ports

http_access allow whitelist
http_access deny all

# Chains to the user's own corporate proxy (proxy.env) if one is configured —
# generated by entrypoint.sh from $UPSTREAM_PROXY; empty (no-op) otherwise.
include /etc/squid/upstream.conf

# No disk cache — this proxy is for access control, not performance.
cache deny all
cache_effective_user proxy
cache_effective_group proxy
coredump_dir /var/spool/squid

# Log every request (allowed and denied) to a file in the proxy-logs volume.
# The healthcheck in proxy.docker-compose.yml is `squid -k check`, not an
# actual client connection to this port — tried a raw `nc -z 127.0.0.1 3128`
# probe first, but Squid logs every such open-then-close-without-HTTP as a
# bogus "transaction-end-before-headers" error every 5s, and an
# `access_log none <acl matching src 127.0.0.1>` exclusion placed before
# this line does NOT suppress it (tested): malformed/incomplete
# transactions are logged through a path that skips the access_log ACL
# filter entirely. `squid -k check` avoids the problem altogether instead
# of trying to filter it after the fact — it never opens a client
# connection, so there's nothing to log.
# NOTE: don't also log to /dev/stdout here — squid drops privileges to
# cache_effective_user (proxy) before opening log files, and that user can't
# write to this container's stdout, so squid fails to start (tested: both the
# `daemon:` and `stdio:` stdout modules hit this — daemon: fails with EPIPE,
# stdio: with an explicit "not writeable by cache_effective_user" error).
# View live traffic with: sh run.sh logs (or docker exec <proxy> tail -f /var/log/squid/access.log)
access_log stdio:/var/log/squid/access.log squid

visible_hostname toolbelt-proxy

# Squid's default (30s) waits for in-flight requests to finish before
# exiting on SIGTERM/SIGHUP. This proxy caches nothing worth preserving, and
# Docker only waits 10s before SIGKILLing anyway — that mismatch is exactly
# what made `docker compose down`/`stop` slow (tested: ~10s per proxy
# container). Shut down immediately instead.
shutdown_lifetime 0 seconds
