# Whitelist-enforcing egress proxy - merged into every stack, alongside each
# <env>/docker-compose.yml, so every dev container's runtime traffic is
# forced through it. Wired in three places so no invocation path skips it:
#   - run.py: added to the COMPOSE_FILE chain
#   - <env>/devcontainer.json: added to dockerComposeFile (VS Code)
#   - manual `docker compose`: pass -f explicitly (see AGENTS.md)
#
# Compose resolves relative paths in EVERY merged -f file against the first
# file's directory, not each file's own directory (verified empirically -
# see AGENTS.md). The first file is always <env>/docker-compose.yml (run.py
# runs `docker compose` with cwd set there; devcontainer.json lists it first
# too) - but "<env>/" isn't a fixed depth: toolbelts sit one level below the
# repo root (<toolbelt>/docker-compose.yml, so "../common/proxy" reaches
# common/), while agent environments sit one level deeper
# (agents/<agent>/docker-compose.yml, needing "../../common/proxy" instead).
# A single relative default can't be right for both, so the two paths below
# are parameterized - PROXY_BUILD_CONTEXT/PROXY_WHITELIST_DIR - with
# defaults that keep the existing one-level-deep behavior for toolbelts
# (unparameterized manual invocation, matching common/base.docker-compose.yml's
# `../common/.zshrc` mount) while devtool/launcher.py always exports both as
# absolute paths, which sidesteps the relative-resolution rule entirely
# regardless of how deep <env>/ actually is. A manual invocation from an
# agents/<agent>/ directory (see AGENTS.md's Commands section) must export
# these two itself.
#
# `proxy` sits on the stack's ordinary default network, same as `dev` - no
# `internal: true` split. That mechanism was tried and reverted: a container
# whose only network is `internal: true` never gets its published ports
# bound by Docker at all (NetworkSettings.Ports comes back null). Egress
# enforcement for `dev` is done with iptables instead (common/entrypoint.sh),
# which doesn't care what network topology it's running on.
services:
  proxy:
    build:
      context: ${PROXY_BUILD_CONTEXT:-../common/proxy}
      args:
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        NO_PROXY: ${NO_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
        no_proxy: ${no_proxy:-}
    image: toolbelt-proxy:latest
    init: true
    environment:
      # Chains Squid to the user's own corporate proxy (proxy.env), if any,
      # so the whitelist and a required corporate proxy aren't mutually
      # exclusive. Empty when proxy.env has nothing set.
      - UPSTREAM_PROXY=${HTTP_PROXY:-${HTTPS_PROXY:-}}
    volumes:
      - ${PROXY_WHITELIST_DIR:-../common/proxy/whitelist.d}:/etc/squid/whitelist.d:ro
      - proxy-logs:/var/log/squid
    healthcheck:
      # Not a raw TCP probe (nc -z) - that opens and closes the client port
      # without speaking HTTP, which Squid logs every time as a bogus
      # "transaction-end-before-headers" error (tested: an access_log ACL
      # exclusion doesn't suppress it, that logging path skips ACLs
      # entirely). `squid -k check` verifies the running process is alive
      # via its own signal/PID-file mechanism instead, so it never touches
      # port 3128 and never shows up in access.log.
      test: ["CMD", "squid", "-k", "check"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  proxy-logs:
